services:
  banking-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: digital-banking-backend:1.3.0
    container_name: banking-backend
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8080}:8080"
    networks:
      - banking-demo
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  wso2-apim:
    image: "${APIM_IMAGE:-wso2/wso2am:4.7.0}"
    container_name: wso2-apim-4.7.0
    restart: unless-stopped
    depends_on:
      banking-backend:
        condition: service_healthy
    ports:
      - "${APIM_MANAGEMENT_HTTPS_PORT:-9443}:9443"
      - "${APIM_GATEWAY_HTTPS_PORT:-8243}:8243"
      - "${APIM_GATEWAY_HTTP_PORT:-8280}:8280"
    networks:
      - banking-demo
    volumes:
      - apim-database:/home/wso2carbon/wso2am-4.7.0/repository/database
      - apim-deployment:/home/wso2carbon/wso2am-4.7.0/repository/deployment/server
      - apim-logs:/home/wso2carbon/wso2am-4.7.0/repository/logs
    stop_grace_period: 2m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --insecure --fail --silent --show-error
          https://127.0.0.1:9443/api/am/gateway/v2/server-startup-healthcheck
          >/dev/null
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 150s

networks:
  banking-demo:
    name: banking-demo

volumes:
  apim-database:
    name: banking-demo-apim-database
  apim-deployment:
    name: banking-demo-apim-deployment
  apim-logs:
    name: banking-demo-apim-logs

openapi: 3.0.3
info:
  title: Digital Banking Platform API
  version: 1.0.0
  description: 'A fictional, in-memory digital banking platform designed for demonstration through WSO2 API Manager
    4.7.


    The sample domain includes GTQ and USD accounts,

    standardized account identifiers, domestic clearing (CCA), real-time gross settlement (LBTR),

    regional payments (SIPA), family remittances, maker-checker approval, and compliance review.


    All people, institutions, account identifiers, thresholds, exchange rates, and policy rules are

    synthetic demo data. The backend does not authenticate OAuth tokens itself; WSO2 API Manager is

    expected to enforce authentication, subscriptions, scopes, throttling, and mediation policies.

    '
  contact:
    name: Demo Banking Engineering Team
  license:
    name: Apache-2.0
servers:
- url: http://banking-backend:8080
  description: Docker Compose backend service
tags:
- name: Health
- name: Administration
- name: Customers
- name: Accounts
- name: Beneficiaries
- name: Cards
- name: Transfers
- name: Remittances
- name: Compliance
security:
- OAuth2: []
paths:
  /health:
    get:
      tags:
      - Health
      operationId: getHealth
      summary: Check service health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /admin/snapshot:
    get:
      tags:
      - Administration
      operationId: getDemoSnapshot
      summary: Return counts for the current in-memory state
      security:
      - OAuth2:
        - banking.admin
      responses:
        '200':
          $ref: '#/components/responses/SnapshotResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /admin/reset:
    post:
      tags:
      - Administration
      operationId: resetDemoState
      summary: Reset the service to its original seed data
      description: Intended only for deterministic demo setup and automated tests.
      security:
      - OAuth2:
        - banking.admin
      responses:
        '200':
          description: State reset
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeBase'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - reset
                      - snapshot
                      properties:
                        reset:
                          type: boolean
                        snapshot:
                          $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/customers/{customerId}:
    parameters:
    - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
      - Customers
      operationId: getCustomer
      summary: Get a customer profile
      security:
      - OAuth2:
        - customers.read
      responses:
        '200':
          description: Customer profile
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
      - Customers
      operationId: patchCustomer
      summary: Partially update mutable customer profile fields
      security:
      - OAuth2:
        - customers.write
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
            example:
              preferredLanguage: es-GT
              contact:
                mobile: +502 5550 0199
      responses:
        '200':
          description: Updated customer
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/customers/{customerId}/accounts:
    parameters:
    - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
      - Accounts
      operationId: listCustomerAccounts
      summary: List a customer's accounts
      security:
      - OAuth2:
        - accounts.read
      responses:
        '200':
          description: Customer accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/customers/{customerId}/cards:
    parameters:
    - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
      - Cards
      operationId: listCustomerCards
      summary: List a customer's cards
      security:
      - OAuth2:
        - cards.read
      responses:
        '200':
          description: Customer cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardCollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/customers/{customerId}/beneficiaries:
    parameters:
    - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
      - Beneficiaries
      operationId: listBeneficiaries
      summary: List transfer beneficiaries
      security:
      - OAuth2:
        - beneficiaries.read
      responses:
        '200':
          description: Beneficiaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryCollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags:
      - Beneficiaries
      operationId: createBeneficiary
      summary: Create a beneficiary
      description: New or replaced beneficiaries enter pending verification and trigger demo cooling-period controls.
      security:
      - OAuth2:
        - beneficiaries.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryInput'
            example:
              type: DOMESTIC_EXTERNAL
              name: Proveedor Comercial Regional
              bankCode: DEMO-03
              bankName: Banco Comercial Demo
              country: GT
              currency: GTQ
              accountNumberMasked: '**** **** **** 9012'
              alias: Proveedor mensual
      responses:
        '201':
          description: Beneficiary created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/customers/{customerId}/beneficiaries/{beneficiaryId}:
    parameters:
    - $ref: '#/components/parameters/CustomerId'
    - $ref: '#/components/parameters/BeneficiaryId'
    put:
      tags:
      - Beneficiaries
      operationId: replaceBeneficiary
      summary: Fully replace a beneficiary
      security:
      - OAuth2:
        - beneficiaries.write
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryInput'
      responses:
        '200':
          description: Beneficiary replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/accounts/{accountId}:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    get:
      tags:
      - Accounts
      operationId: getAccount
      summary: Get account balances and limits
      security:
      - OAuth2:
        - accounts.read
      responses:
        '200':
          description: Account
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/accounts/{accountId}/transactions:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    get:
      tags:
      - Accounts
      operationId: listAccountTransactions
      summary: List booked ledger entries
      security:
      - OAuth2:
        - accounts.read
      parameters:
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ledger entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerCollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/accounts/{accountId}/limits:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    patch:
      tags:
      - Accounts
      operationId: patchAccountLimits
      summary: Change one or more account limits
      security:
      - OAuth2:
        - accounts.limits.write
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLimitsPatch'
            example:
              dailyTransferLimit:
                currency: GTQ
                amount: '85000.00'
      responses:
        '200':
          description: Account with updated limits
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/cards/{cardId}:
    parameters:
    - $ref: '#/components/parameters/CardId'
    get:
      tags:
      - Cards
      operationId: getCard
      summary: Get card status and controls
      security:
      - OAuth2:
        - cards.read
      responses:
        '200':
          description: Card
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
      - Cards
      operationId: patchCard
      summary: Change card status or channel controls
      security:
      - OAuth2:
        - cards.write
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPatch'
            example:
              status: TEMPORARILY_BLOCKED
              controls:
                ecommerceEnabled: false
      responses:
        '200':
          description: Updated card
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/transfers:
    post:
      tags:
      - Transfers
      operationId: createTransfer
      summary: Initiate an internal, CCA, LBTR, or SIPA transfer
      description: 'Reserves available funds immediately. Depending on rail, amount, beneficiary age/verification,

        and customer risk, the transfer may require maker-checker approval, compliance review, or both.

        Idempotency-Key makes retried requests safe.

        '
      security:
      - OAuth2:
        - transfers.write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCreate'
            examples:
              domesticClearing:
                summary: Domestic CCA supplier payment
                value:
                  debtorAccountId: ACC-GTQ-001
                  beneficiaryId: BEN-GT-001
                  rail: CCA
                  amount:
                    currency: GTQ
                    amount: '1250.00'
                  purposeCode: EDUCATION
                  reference: Colegiatura agosto
              internal:
                summary: Immediate internal transfer
                value:
                  debtorAccountId: ACC-GTQ-001
                  beneficiaryId: BEN-GT-002
                  rail: INTERNAL
                  amount:
                    currency: GTQ
                    amount: '150.00'
                  purposeCode: FAMILY_SUPPORT
                  reference: Apoyo familiar
      responses:
        '201':
          description: Transfer created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '200':
          description: Idempotent replay of an existing result
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                example: 'true'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    get:
      tags:
      - Transfers
      operationId: listTransfers
      summary: Search transfers
      security:
      - OAuth2:
        - transfers.read
      parameters:
      - name: accountId
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TransferStatus'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching transfers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferCollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/transfers/{transferId}:
    parameters:
    - $ref: '#/components/parameters/TransferId'
    get:
      tags:
      - Transfers
      operationId: getTransfer
      summary: Get transfer workflow state
      security:
      - OAuth2:
        - transfers.read
      responses:
        '200':
          description: Transfer
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
      - Transfers
      operationId: actOnTransfer
      summary: Apply a workflow action to a transfer
      description: Allowed actions depend on current state. Typical actions are APPROVE, REJECT, CANCEL, SETTLE,
        and RETURN.
      security:
      - OAuth2:
        - transfers.approve
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferAction'
            example:
              action: APPROVE
              actor: supervisor.maria
      responses:
        '200':
          description: Transfer after action
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/remittances/quotes:
    post:
      tags:
      - Remittances
      operationId: createRemittanceQuote
      summary: Quote an incoming USD-to-GTQ account-credit remittance
      security:
      - OAuth2:
        - remittances.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemittanceQuoteCreate'
            example:
              senderCountry: US
              sourceAmount:
                currency: USD
                amount: '350.00'
              payoutMethod: ACCOUNT_CREDIT
              destinationAccountId: ACC-GTQ-001
      responses:
        '201':
          description: Time-limited quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittanceQuoteResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/remittances:
    post:
      tags:
      - Remittances
      operationId: createRemittance
      summary: Register an incoming family remittance
      security:
      - OAuth2:
        - remittances.write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemittanceCreate'
            example:
              quoteId: RQT-GT-example
              externalReference: MTO-2026-000091
              sender:
                name: Luis Herrera
                country: US
                relationship: Hermano
              beneficiaryCustomerId: CUS-GT-001
      responses:
        '201':
          description: Remittance created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittanceResponse'
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittanceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    get:
      tags:
      - Remittances
      operationId: listRemittances
      summary: Search remittances
      security:
      - OAuth2:
        - remittances.read
      parameters:
      - name: customerId
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/RemittanceStatus'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching remittances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittanceCollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/remittances/{remittanceId}:
    parameters:
    - $ref: '#/components/parameters/RemittanceId'
    get:
      tags:
      - Remittances
      operationId: getRemittance
      summary: Get a remittance
      security:
      - OAuth2:
        - remittances.read
      responses:
        '200':
          description: Remittance
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittanceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
      - Remittances
      operationId: actOnRemittance
      summary: Pay out, cancel, or reject a remittance
      security:
      - OAuth2:
        - remittances.payout
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemittanceAction'
            example:
              action: PAYOUT
      responses:
        '200':
          description: Updated remittance
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittanceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/compliance/cases:
    post:
      tags:
      - Compliance
      operationId: createComplianceCase
      summary: Open a manual compliance case
      security:
      - OAuth2:
        - compliance.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceCaseCreate'
      responses:
        '201':
          description: Case created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCaseResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    get:
      tags:
      - Compliance
      operationId: listComplianceCases
      summary: Search compliance cases
      security:
      - OAuth2:
        - compliance.read
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - IN_REVIEW
          - RESOLVED
      - name: customerId
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCaseCollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/compliance/cases/{caseId}:
    parameters:
    - $ref: '#/components/parameters/CaseId'
    get:
      tags:
      - Compliance
      operationId: getComplianceCase
      summary: Get a compliance case
      security:
      - OAuth2:
        - compliance.read
      responses:
        '200':
          description: Compliance case
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCaseResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags:
      - Compliance
      operationId: actOnComplianceCase
      summary: Assign, annotate, or resolve a case
      description: Resolving a linked case atomically advances or rejects the linked transfer/remittance.
      security:
      - OAuth2:
        - compliance.write
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceCaseAction'
            examples:
              assign:
                value:
                  action: ASSIGN
                  assignedTo: aml.analyst
              resolve:
                value:
                  action: RESOLVE
                  disposition: CLEARED
                  note: Source of funds confirmed
      responses:
        '200':
          description: Updated case
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCaseResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 token validation and scope enforcement are performed by WSO2 API Manager.
      flows:
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes:
            customers.read: Read customer profiles
            customers.write: Update customer profiles
            accounts.read: Read accounts and ledger entries
            accounts.limits.write: Change account limits
            beneficiaries.read: Read beneficiaries
            beneficiaries.write: Create or replace beneficiaries
            cards.read: Read cards
            cards.write: Change card controls
            transfers.read: Read transfers
            transfers.write: Initiate transfers
            transfers.approve: Approve and operate transfer workflows
            remittances.read: Read remittances
            remittances.write: Quote and create remittances
            remittances.payout: Pay or reject remittances
            compliance.read: Read compliance cases
            compliance.write: Manage compliance cases
            banking.admin: Reset and inspect demo state
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        example: CUS-GT-001
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        example: ACC-GTQ-001
    BeneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      schema:
        type: string
        example: BEN-GT-001
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        example: CARD-GT-001
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
        example: TRF-GT-example
    RemittanceId:
      name: remittanceId
      in: path
      required: true
      schema:
        type: string
        example: RMT-GT-example
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        example: CMP-GT-example
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Numeric version returned in the resource ETag, for example `"1"`.
      schema:
        type: string
        example: '"1"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for safely retrying a POST. Reusing it with a different body returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        example: 0bbca8d9-cca-transfer-001
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  headers:
    ETag:
      description: Strong entity version used with If-Match.
      schema:
        type: string
        example: '"2"'
  responses:
    ProblemResponse:
      description: Error represented as an RFC 9457-style problem detail
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SnapshotResponse:
      description: Current in-memory entity counts
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/EnvelopeBase'
            - type: object
              properties:
                data:
                  $ref: '#/components/schemas/Snapshot'
  schemas:
    Money:
      type: object
      required:
      - currency
      - amount
      properties:
        currency:
          type: string
          enum:
          - GTQ
          - USD
        amount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
          example: '1250.00'
      description: Decimal amount encoded as a string. The service stores it internally as integer minor units.
    Metadata:
      type: object
      required:
      - correlationId
      properties:
        correlationId:
          type: string
          format: uuid
        fapiInteractionId:
          type: string
        count:
          type: integer
        replayed:
          type: boolean

openapi: 3.0.3
info:
  title: Customer Profile API
  version: 1.0.0
  description: >-
    Customer profile retrieval and controlled profile updates.


    This is a standalone context contract for WSO2 API Manager 4.7. All data and policy values are fictional and
    intended only for demonstrations.
  contact:
    name: Demo Banking Engineering Team
  license:
    name: Apache-2.0
servers:
  - url: http://banking-backend:8080
    description: Docker Compose backend service
x-wso2-basePath: /customer-profile/1.0.0
x-wso2-production-endpoints:
  urls:
    - http://banking-backend:8080
  type: http
x-wso2-sandbox-endpoints:
  urls:
    - http://banking-backend:8080
  type: http
tags:
  - name: Customers
paths:
  /v1/customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags:
        - Customers
      operationId: getCustomer
      summary: Get a customer profile
      security:
        - OAuth2:
            - banking.customers.read
      responses:
        "200":
          description: Customer profile
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
    patch:
      tags:
        - Customers
      operationId: patchCustomer
      summary: Partially update mutable customer profile fields
      security:
        - OAuth2:
            - banking.customers.write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPatch"
            example:
              preferredLanguage: es-GT
              contact:
                mobile: +502 5550 0199
      responses:
        "200":
          description: Updated customer
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        default:
          $ref: "#/components/responses/ProblemResponse"
security:
  - OAuth2: []
components:
  headers:
    ETag:
      description: Strong entity version used with If-Match.
      schema:
        type: string
        example: '"2"'
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        example: CUS-GT-001
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Numeric version returned in the resource ETag, for example `"1"`.
      schema:
        type: string
        example: '"1"'
  responses:
    ProblemResponse:
      description: Error represented as an RFC 9457-style problem detail
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Address:
      type: object
      additionalProperties:
        type: string
      properties:
        department:
          type: string
        municipality:
          type: string
        zone:
          type: string
    Contact:
      type: object
      properties:
        email:
          type: string
          format: email
        mobile:
          type: string
    Customer:
      type: object
      required:
        - customerId
        - customerType
        - legalName
        - displayName
        - kycStatus
        - riskRating
        - version
      properties:
        customerId:
          type: string
        customerType:
          type: string
          enum:
            - INDIVIDUAL
            - LEGAL_ENTITY
        legalName:
          type: string
        displayName:
          type: string
        document:
          type: object
          properties:
            type:
              type: string
              enum:
                - DPI
                - REGISTRATION
            maskedNumber:
              type: string
        taxIdMasked:
          type: string
        kycStatus:
          type: string
          enum:
            - VERIFIED
            - ENHANCED_DUE_DILIGENCE
            - PENDING
        riskRating:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
        preferredLanguage:
          type: string
          enum:
            - es-GT
            - en-US
        contact:
          $ref: "#/components/schemas/Contact"
        address:
          $ref: "#/components/schemas/Address"
        accountIds:
          type: array
          items:
            type: string
        beneficiaryIds:
          type: array
          items:
            type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CustomerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 120
        preferredLanguage:
          type: string
          enum:
            - es-GT
            - en-US
        contact:
          $ref: "#/components/schemas/Contact"
        address:
          $ref: "#/components/schemas/Address"
    CustomerResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Customer"
    EnvelopeBase:
      type: object
      required:
        - data
        - meta
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/Metadata"
    Metadata:
      type: object
      required:
        - correlationId
      properties:
        correlationId:
          type: string
          format: uuid
        fapiInteractionId:
          type: string
        count:
          type: integer
        replayed:
          type: boolean
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
        - correlationId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 token validation and scope enforcement are performed by WSO2 API Manager.
      flows:
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes:
            banking.customers.read: Read customer profiles
            banking.customers.write: Update customer profiles
x-demo-apim-context: /customer-profile
